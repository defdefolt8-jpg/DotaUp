[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/steam-auth/:splat"
  status = 200

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile-state"
  status = 200

[[redirects]]
  from = "/"
  to = "/site/index.html"
  status = 200

